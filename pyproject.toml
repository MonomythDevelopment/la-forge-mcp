[project]
name = "la-forge-mcp"
version = "1.0.0"
description = "MCP server for visual CSS debugging - seeing what AI can't"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "La Forge MCP Contributors"}
]
keywords = ["mcp", "css", "debugging", "visual-testing", "chrome-devtools", "claude-code"]

dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
